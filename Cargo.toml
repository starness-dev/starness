[workspace]
resolver = "2"
members = [
    "crates/starness-ir",
    "crates/starness-starlark",
    "crates/starness-runtime",
    "bins/starness-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/starness-dev/starness"
readme = "README.md"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[workspace.dependencies]
starness-ir = { path = "crates/starness-ir" }
starness-starlark = { path = "crates/starness-starlark" }
starness-runtime = { path = "crates/starness-runtime" }

starlark = "0.14.2"
starlark_map = "0.14.2"
starlark_syntax = "0.14.2"
starlark_lsp = "0.14.2"
allocative = "0.3"
async-trait = "0.1"
base64 = "0.23"
bytes = "1"
decision-rs = { version = "0.7.0", default-features = false, features = ["retry", "rustls-tls"] }
dupe = "0.9"
futures = { version = "0.3", default-features = false, features = ["std"] }
genai = { version = "0.7.5", default-features = false, features = ["rustls-tls"] }
http = "1"
http-body-util = "0.1"
rmcp = { version = "3.11.0", features = [
    "auth",
    "server",
    "client",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
    "reqwest",
] }
tokio-util = "0.7"
xstate-statemachine = { version = "0.1.1", features = ["tokio", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
indexmap = { version = "2.6", features = ["serde"] }
keyring = "4.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.43", default-features = false, features = ["cache", "libsqlite3-sys", "bundled"] }
rust-embed = "8"
secrecy = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net"] }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
